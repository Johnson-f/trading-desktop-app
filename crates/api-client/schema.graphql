schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type Query {
  version: String!
  health: String!
  searchSymbols(q: String!, limit: Int): [Symbol!]!
  bars(
    symbol: String!
    bucket: BucketInput!
    from: DateTime!
    to: DateTime!
    limit: Int
  ): [HistoricalBar!]!
}

scalar DateTime

enum BarUnit {
  MINUTE
  HOUR
  DAY
  WEEK
  MONTH
}

input BucketInput {
  unit: BarUnit!
  count: Int!
}

"""
One aggregated OHLCV bar from the historical store. Prices are integer
cents (Decimal32(2) on disk) — divide by 100 to render dollars.
"""
type HistoricalBar {
  ts: DateTime!
  open: Int!
  high: Int!
  low: Int!
  close: Int!
  volume: Int!
}

type Mutation {
  ping: Boolean!
}

type Subscription {
  ticks(symbols: [String!]!): TickEvent!
}

union TickEvent = SeedEvent | TodayEvent | DeltaEvent | FinalizeEvent

type Bar {
  ts: Int!
  o: Int!
  h: Int!
  l: Int!
  c: Int!
  v: Int!
}

type SeedEvent {
  symbol: String!
  candle: Bar
}

type TodayEvent {
  symbol: String!
  bars: [Bar!]!
}

type DeltaEvent {
  symbol: String!
  ts: Int!
  c: Int!
  h: Int
  l: Int
  v: Int
}

type FinalizeEvent {
  symbol: String!
  candle: Bar!
}

type Symbol {
  id: String!
  symbol: String!
  longName: String
  exchange: String!
  quoteType: String!
}
