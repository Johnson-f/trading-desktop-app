[package]
name = "chart-widget"
version = "0.1.0"
edition = "2024"

[dependencies]
egui-shadcn = { path = "../egui-shadcn" }
api-client = { path = "../api-client" }
chart-core = { path = "../chart-core" }
database = { path = "../database" }
theme = { path = "../theme" }

# UI
eframe = "0.34.1"
egui = "0.34.1"
egui-phosphor = "0.12"
egui_extras = { version = "0.34", features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# wgpu rendering
wgpu = "29"
egui-wgpu = "0.34"
bytemuck = { version = "1", features = ["derive"] }

# Async + data
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
chrono = "0.4"

# Persistence (drawings layer)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Drawing geometry
kurbo = "0.13.0"

tracing = "0.1"
