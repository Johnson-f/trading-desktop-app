[package]
name = "historical-backfill"
version = "0.1.0"
edition = "2024"

[dependencies]
markets = { path = "../markets" }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
clickhouse = { version = "0.15", features = ["chrono", "inserter", "rustls-tls"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"

[dev-dependencies]
wiremock = "0.6"
