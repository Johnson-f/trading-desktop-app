[package]
name = "historical-backfill"
version = "0.1.0"
edition = "2024"

[dependencies]
markets = { path = "../markets" }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
iceberg = "0.9"
iceberg-catalog-rest = "0.9"
iceberg-storage-opendal = "0.9"
arrow = "57"
arrow-array = "57"
arrow-schema = "57"
parquet = "57"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
testcontainers = "0.20"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
