[package]
name = "markets"
version = "0.1.0"
edition = "2024"

[dependencies]
# HTTP client (core dependency)
reqwest = { version = "0.13", features = ["json", "cookies", "gzip", "brotli", "blocking", "query"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"

# Error handling
thiserror = "2.0.17"
anyhow = "1"

# Date and time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# URL parsing
url = "2"

# HTTP-date parsing (for Retry-After header)
httpdate = "1"

# Regex for parsing
regex = "1"

# Async utilities
async-trait = "0.1"
futures = "0.3"

# Thread-safe primitives
once_cell = "1"

# Compile-time string concatenation
const_format = "0.2"

# Logging and tracing
tracing = "0.1"

# HTML parsing for web scraping
scraper = "0.25.0"

# WebSocket streaming support
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-stream = { version = "0.1", features = ["sync"] }
prost = "0.14.1"
base64 = "0.22"

# Optional: DataFrame support
polars = { version = "0.53", optional = true, default-features = false, features = ["lazy"] }

[features]
default = []
# Enable DataFrame conversions with polars
dataframe = ["dep:polars"]
# Enable technical analysis indicators
indicators = []
# Enable backtesting engine for strategy simulation (requires indicators)
backtesting = ["indicators"]

[dev-dependencies]
# Re-declare tokio with `test-util` so `tokio::time::pause()` is available in
# the rate_limiter unit tests. Cargo merges this with the [dependencies] entry,
# so we just need the additional feature here.
tokio = { version = "1", features = ["full", "test-util"] }
serial_test = "3"
