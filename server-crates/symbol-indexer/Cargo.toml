[package]
name = "symbol-indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
markets = { path = "../markets" }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"

[dev-dependencies]
wiremock = "0.6"
