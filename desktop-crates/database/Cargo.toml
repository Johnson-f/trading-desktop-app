[package]
name = "zaned-database"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.50", features = ["rt", "macros"] }
dirs = "5.0"
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
