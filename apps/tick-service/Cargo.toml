[package]
name = "tick-service"
version = "0.1.0"
edition = "2024"

[dependencies]
markets = { path = "../../crates/markets" }
linked-hash-map = "0.5"
tokio = { version = "1", features = ["full"] }
redis = { version = "1.2", features = ["tokio-comp", "connection-manager", "script"] }
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
dotenvy = "0.15"

[dev-dependencies]
wiremock = "0.6"
