[package]
name = "desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
api-client = { path = "../../crates/api-client" }
chart-widget = { path = "../../crates/chart-widget" }
database = { path = "../../crates/database" }
theme = { path = "../../crates/theme" }
eframe = "0.34.1"
egui = "0.34.1"
# Image-loader extras: pulls in `ehttp` for HTTP fetching and the `image`
# crate for PNG/JPEG decoding. Used by the `logo` module for stock logos
# served from Parqet's CDN. `install_image_loaders` is called once at boot.
egui_extras = { version = "0.34", features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
egui-phosphor = "0.12"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "5.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
oauth2 = "5"
webbrowser = "1"
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
anyhow = "1"
tracing = "0.1"
url = "2"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
urlencoding = "2"
dotenvy = "0.15"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
