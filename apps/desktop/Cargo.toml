[package]
name = "Zaned"
version = "0.1.0"
edition = "2024"

[dependencies]
zaned-api-client = { path = "../../shared-crates/api-client" }
zaned-chart-core = { path = "../../desktop-crates/chart-core" }
zaned-database = { path = "../../desktop-crates/database" }
eframe = "0.34.1"
egui = "0.34.1"
egui-phosphor = "0.12"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
wgpu = "29"
egui-wgpu = "0.34"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
kurbo = "0.13.0"
dirs = "5.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
oauth2 = "5"
webbrowser = "1"
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
anyhow = "1"
tracing = "0.1"
url = "2"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
urlencoding = "2"
dotenvy = "0.15"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
