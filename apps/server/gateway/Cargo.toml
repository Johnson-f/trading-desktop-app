[package]
name = "zaned-server"
version = "0.1.0"
edition = "2024"

[dependencies]
markets = { path = "../../../server-crates/markets" }
historical-backfill = { path = "../../../server-crates/historical-backfill" }
symbol-indexer = { path = "../../../server-crates/symbol-indexer" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.50", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redis = { version = "1.2", features = ["tokio-comp", "connection-manager", "script"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clickhouse = { version = "0.15", features = ["chrono", "rustls-tls"] }
# rustls 0.23 requires an explicit CryptoProvider selection at runtime;
# we install the `ring` provider once at the top of `main`. The ClickHouse
# client (above) and the WebSocket subscriptions in markets pull rustls
# transitively, but neither picks a provider for us — see main.rs.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
dotenvy = "0.15"
linked-hash-map = "0.5"
clerk-rs = { version = "0.4", features = ["axum"] }
async-graphql = { version = "7", features = ["chrono"] }
async-graphql-axum = "7"
async-stream = "0.3"

[dev-dependencies]
wiremock = "0.6"
